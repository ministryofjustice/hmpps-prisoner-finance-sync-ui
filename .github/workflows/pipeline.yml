name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ""
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check_publish:
    name: Check publish flag
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ github.ref == 'refs/heads/main' && (inputs.push || inputs.push == null) }}
    steps:
      - name: Set publish flag
        run: echo "Publishing enabled ${{ github.ref == 'refs/heads/main' && (inputs.push || inputs.push == null) }}"

  node_build:
    name: node build
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_build.yml@v2
    secrets: inherit
    with:
      install_command: "npm run setup"
      npm_version: "12.0.2"

  node_unit_tests:
    name: node unit tests
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_unit_tests.yml@v2
    needs: [node_build]
    secrets: inherit

  node_integration_tests:
    name: node integration tests
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_integration_tests.yml@v2
    needs: [node_build]
    secrets: inherit

  helm_lint:
    strategy:
      matrix:
        environments: ["dev", "preprod", "prod"]
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}

  build:
    name: Build docker image from hmpps-github-actions
    if: github.ref == 'refs/heads/main'
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    needs:
      - node_integration_tests
      - node_unit_tests
      - check_publish
    with:
      docker_registry: "ghcr.io"
      registry_org: "ministryofjustice"
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ needs.check_publish.outputs.enabled == 'true' }}
      docker_multiplatform: false
      generate_sbom: ${{ needs.check_publish.outputs.enabled == 'true' }}
      attach_sbom_to_registry: ${{ needs.check_publish.outputs.enabled == 'true' }}
      sign_image: ${{ needs.check_publish.outputs.enabled == 'true' }}

  deploy_dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    if: needs.check_publish.outputs.enabled == 'true'
    needs:
      - check_publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}

      - name: Deploy_dashboard
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ vars.DASHBOARD_RESOURCE_GROUP }}" \
            --template-file "./deploy/dashboards/prisoner-finance-template-arm.json" \
            --parameters serializedData="$(jq -c . ./deploy/dashboards/dashboard-dev.json)"

  deploy_dev:
    name: Deploy to the development environment
    if: needs.check_publish.outputs.enabled == 'true'
    needs:
      - build
      - helm_lint
      - check_publish
      - deploy_dashboard
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: "dev"
      app_version: "${{ needs.build.outputs.app_version }}"
      slack_notification: "true"

  dev_smoke_tests:
    name: Dev smoke test
    uses: ./.github/workflows/smoke-test-dev.yml
    secrets: inherit
    needs:
      - deploy_dev

  deploy_preprod:
    name: Deploy to pre-production environment
    needs:
      - build
      - deploy_dev
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: "preprod"
      app_version: "${{ needs.build.outputs.app_version }}"
      slack_notification: "false"

  deploy_prod:
    name: Deploy to production environment
    needs:
      - build
      - deploy_preprod
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: "prod"
      app_version: "${{ needs.build.outputs.app_version }}"
      slack_notification: "false"
